name: Scrape leaderboards

on:
  schedule:
    - cron: "*/10 * * * *" # free on a public repo; GitHub often starts scheduled runs a few minutes late
  workflow_dispatch:

concurrency: scrape

jobs:
  scrape:
    runs-on: ubuntu-24.04 # Playwright 1.58 has no browser build for Ubuntu 26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run scrape
        env:
          MWI_ACCESS_TOKEN: ${{ secrets.MWI_ACCESS_TOKEN }}
          MWI_HASH: ${{ secrets.MWI_HASH }}
          MWI_CHARACTER_ID: ${{ secrets.MWI_CHARACTER_ID }}
          MWI_GAME_VERSION: ${{ secrets.MWI_GAME_VERSION }}
          MWI_VERSION_TIMESTAMP: ${{ secrets.MWI_VERSION_TIMESTAMP }}
          INGEST_URL: ${{ vars.INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
