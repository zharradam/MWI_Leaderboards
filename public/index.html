<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MWI XP Tracker</title>
    <style>
        /* Milky Way, this site's own look. Token names are shared with looks.css so every look restyles the page.
           Dark or light follows the system unless html[data-theme] says otherwise. */
        :root {
            color-scheme: light;
            --ground: #f6f5fb; --surface: #ffffff; --sunk: #ecebf5; --raise: #ffffff;
            --ink: #1c1a2e; --ink-soft: #4d4a68; --ink-faint: #6a6787;
            --rule: #dddbea; --rule-strong: #bcb9d3;
            --accent: #6d4fd8; --accent-soft: #ebe6fb; --cf-accent-ink: #5a3cc4;
            --win: #17794a; --caution: #c0362c;
            --amber: light-dark(#a36200, #f0b429); /* not a looks token, so it keys off each look's color-scheme */
            --sans: system-ui, "Segoe UI", Roboto, sans-serif;
            --serif: var(--sans);
            --mono: ui-monospace, SFMono-Regular, Consolas, monospace;
            --r: 6px;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                color-scheme: dark;
                --ground: #17172b; --surface: #1d1d35; --sunk: #131326; --raise: #262645;
                --ink: #eceaf7; --ink-soft: #b6b2d2; --ink-faint: #8f8bb0;
                --rule: #2b2b4b; --rule-strong: #44446e;
                --accent: #a78bfa; --accent-soft: #2a2550; --cf-accent-ink: #c4b5fd;
                --win: #4ade80; --caution: #f87171;
            }
        }
        :root[data-theme="dark"] {
            color-scheme: dark;
            --ground: #17172b; --surface: #1d1d35; --sunk: #131326; --raise: #262645;
            --ink: #eceaf7; --ink-soft: #b6b2d2; --ink-faint: #8f8bb0;
            --rule: #2b2b4b; --rule-strong: #44446e;
            --accent: #a78bfa; --accent-soft: #2a2550; --cf-accent-ink: #c4b5fd;
            --win: #4ade80; --caution: #f87171;
        }

        *, *::before, *::after { box-sizing: border-box; }
        * { margin: 0; padding: 0; }
        [hidden] { display: none !important; }
        ::selection { background: var(--accent); color: var(--ground); }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        html { scrollbar-color: var(--rule-strong) transparent; scrollbar-width: thin; }

        body {
            background: var(--ground);
            color: var(--ink);
            font: 14px/1.4 var(--sans);
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            height: 100dvh;
        }

        header {
            display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
            padding: 12px 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--rule);
        }
        .brand { display: flex; align-items: center; gap: 12px; margin-right: auto; min-width: 0; }
        .brand svg { width: 28px; height: 28px; flex: none; color: var(--accent); }
        h1 { font: 650 20px/1.2 var(--serif); color: var(--ink); letter-spacing: -0.01em; white-space: nowrap; }

        .f, .look { display: flex; flex-direction: row; align-items: center; gap: 8px; color: var(--ink-soft); font-size: 13px; }

        select, input[type="search"], .btn, .mode {
            font: inherit; color: var(--ink);
            background: var(--surface);
            border: 1px solid var(--rule-strong);
            border-radius: var(--r);
            padding: 6px 10px;
        }
        select, .btn, .mode { cursor: pointer; }
        select:hover, .btn:hover, input[type="search"]:hover { border-color: var(--accent); }
        .btn.icon { display: inline-flex; padding: 7px; }
        .btn.icon svg { width: 16px; height: 16px; }

        .modes { display: flex; gap: 4px; }
        .mode { color: var(--ink-soft); }
        .mode:hover { color: var(--ink); border-color: var(--accent); }
        .mode[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--cf-accent-ink); font-weight: 600; }
        /* Dashboard's unpressed tabs are white for its gradient header, which this page doesn't have. */
        :root[data-look="dash"] .mode:not([aria-pressed="true"]) { color: var(--ink-soft); }
        /* Tome paints the page dark and expects content on a parchment sheet. */
        :root[data-look="tome"] main { background: var(--ground); }

        main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; min-height: 0; }

        #chart-area { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 14px; min-width: 0; min-height: 0; padding: 14px 16px 10px 20px; }
        .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
        #viewPicker { margin-left: auto; }
        /* Feed freshness: green when recent, amber when a run or two was missed, red when the feed looks broken. */
        #status {
            --state: var(--win);
            display: inline-flex; align-items: center; gap: 8px;
            padding: 5px 12px 5px 10px;
            font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap;
            color: var(--ink);
            background: color-mix(in srgb, var(--state) 12%, transparent);
            border: 1px solid color-mix(in srgb, var(--state) 45%, transparent);
            border-radius: 999px;
        }
        #status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--state); }
        #status[data-state="late"] { --state: var(--amber); }
        #status[data-state="down"] { --state: var(--caution); }
        #status:empty { display: none; }
        #chart-box { position: relative; min-height: 0; }

        #message {
            position: absolute; inset: 0;
            display: grid; place-content: center; justify-items: center; gap: 12px;
            padding: 24px; text-align: center; color: var(--ink-soft);
            background: var(--ground);
        }
        #message strong { color: var(--ink); font-size: 16px; font-weight: 600; }
        #message p { max-width: 46ch; }

        aside { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-left: 1px solid var(--rule); }
        .aside-head { display: grid; gap: 10px; padding: 14px 14px 10px; border-bottom: 1px solid var(--rule); }
        .aside-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
        h2 { font: 600 14px/1.3 var(--sans); }
        #playerCount { color: var(--ink-faint); font-size: 12px; white-space: nowrap; }
        input[type="search"] { width: 100%; background: var(--sunk); }
        input[type="search"]::placeholder { color: var(--ink-faint); }
        .quick { display: flex; gap: 8px; }
        .quick .btn { flex: 1; padding: 4px 8px; font-size: 13px; }

        #players { list-style: none; overflow-y: auto; padding: 6px; flex: 1; }
        #players button {
            display: grid; grid-template-columns: 12px 3ch minmax(0, 1fr) auto; align-items: center; gap: 8px;
            width: 100%; padding: 5px 8px; text-align: left; cursor: pointer;
            font: inherit; background: none; border: 0; border-radius: var(--r); color: var(--ink-faint);
            font-variant-numeric: tabular-nums;
        }
        #players button:hover { background: var(--sunk); }
        #players button[aria-pressed="true"] { color: var(--ink); }
        .swatch { width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid var(--rule-strong); }
        .rank { text-align: right; font-size: 12px; color: var(--ink-faint); }
        .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .total { font-size: 12px; }
        .no-match { padding: 12px; color: var(--ink-soft); }

        @media (max-width: 820px) {
            body { display: block; height: auto; }
            header { padding: 12px 16px; }
            .brand { flex-basis: 100%; }
            #status { order: 1; }
            .look { flex: 1; min-width: 0; }
            .look select { flex: 1; min-width: 0; }
            .f { flex: 1 1 140px; }
            .f select { flex: 1; min-width: 0; }
            #viewPicker { margin-left: 0; }
            main { display: block; }
            #chart-area { height: 68vh; min-height: 380px; padding: 12px 12px 8px; }
            aside { border-left: 0; border-top: 1px solid var(--rule); }
            #players { max-height: 70vh; }
            #players button { padding: 9px 8px; }
        }

        @media (prefers-reduced-motion: no-preference) {
            select, .btn, .mode { transition: border-color 120ms ease-out, background-color 120ms ease-out, color 120ms ease-out; }
        }
    </style>
    <link rel="stylesheet" href="looks.css">
    <script src="looks.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" integrity="sha384-vsrfeLOOY6KuIYKDlmVH5UiBmgIdB1oEf7p01YgWHuqmOHfZr374+odEv96n9tNC" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js" integrity="sha384-Cs3dgUx6+jDxxuqHvVH8Onpyj2LF1gKZurLDlhqzuJmUqVYMJ0THTWpxK5Z086Zm" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js" integrity="sha384-zPzbVRXfR492Sd5D+HydTYCxxgHAfgVO8KERbLlpeH5unsmbAEXrscGUUqLZG9BM" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <div class="brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/>
            </svg>
            <h1>MWI XP Tracker</h1>
        </div>
        <div id="status" role="status"></div>
        <!-- looks.js appends the Look picker and the light/dark button here -->
    </header>

    <main>
        <section id="chart-area" aria-label="XP chart">
            <div class="toolbar">
                <label class="f">Board
                    <select id="typeSelect" disabled></select>
                </label>
                <label class="f">Skill
                    <select id="categorySelect" disabled></select>
                </label>
                <div class="modes" id="rangePicker" role="group" aria-label="Time range">
                    <button class="mode" data-value="1">24h</button>
                    <button class="mode" data-value="3">3d</button>
                    <button class="mode" data-value="7">7d</button>
                    <button class="mode" data-value="30">30d</button>
                </div>
                <div class="modes" id="viewPicker" role="group" aria-label="What the chart shows">
                    <button class="mode" data-value="total">Total gained</button>
                    <button class="mode" data-value="rate">XP per hour</button>
                </div>
                <button class="btn" id="resetZoomBtn" hidden>Reset zoom</button>
            </div>
            <div id="chart-box">
                <canvas id="chart"></canvas>
                <div id="message"><strong>Loading…</strong></div>
            </div>
        </section>

        <aside aria-label="Players">
            <div class="aside-head">
                <div class="aside-title">
                    <h2>Players by XP gained</h2>
                    <span id="playerCount"></span>
                </div>
                <input type="search" id="search" placeholder="Find a player" aria-label="Find a player">
                <div class="quick">
                    <button class="btn" id="top10Btn">Top 10</button>
                    <button class="btn" id="clearBtn">Clear</button>
                </div>
            </div>
            <ul id="players"></ul>
        </aside>
    </main>

    <script type="module">
        // Series colours for dark and light grounds; looks declare which they are through color-scheme.
        const SERIES = {
            dark:  ["#9085e9", "#199e70", "#3987e5", "#d95926", "#c98500", "#d55181", "#2bb3c6", "#e66767", "#7fb23a", "#a89878"],
            light: ["#4a3aa7", "#1baf7a", "#2a78d6", "#eb6834", "#c98500", "#d55181", "#0b9bb0", "#e34948", "#5b8f1d", "#8a7a5c"],
        };
        const REFRESH_MS = 10 * 60 * 1000;
        const LATE_MIN = 25, DOWN_MIN = 60; // the scraper runs every 10 minutes, often a few late: amber past 25, red past an hour
        const SMOOTH = 5;                // XP per hour is averaged over this many points

        const $ = id => document.getElementById(id);
        const typeSelect = $('typeSelect'), categorySelect = $('categorySelect');
        const rangePicker = $('rangePicker'), viewPicker = $('viewPicker');
        const status = $('status'), message = $('message'), playersEl = $('players'), search = $('search');
        const resetZoomBtn = $('resetZoomBtn');

        const compact = new Intl.NumberFormat(undefined, { notation: 'compact', maximumFractionDigits: 2 });
        const full = new Intl.NumberFormat(undefined, { maximumFractionDigits: 0 });
        const fullTime = new Intl.DateTimeFormat(undefined, { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
        const pretty = s => s.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

        let chart = null;
        let data = null;           // last /api/xp response
        let selected = new Set();  // player names drawn on the chart
        let loadedKey = '';        // board the current selection belongs to

        const api = async path => {
            const res = await fetch(path);
            if (!res.ok) throw new Error(`${path} returned ${res.status}`);
            return res.json();
        };

        function showMessage(title, body, retry) {
            message.replaceChildren();
            const strong = document.createElement('strong');
            strong.textContent = title;
            message.append(strong);
            if (body) { const p = document.createElement('p'); p.textContent = body; message.append(p); }
            if (retry) { const b = document.createElement('button'); b.className = 'btn'; b.textContent = 'Try again'; b.onclick = retry; message.append(b); }
            message.hidden = false;
        }

        // A .modes group is a set of buttons where exactly one is pressed.
        const picked = group => group.querySelector('[aria-pressed="true"]').dataset.value;
        function pick(group, value) {
            const buttons = [...group.querySelectorAll('.mode')];
            const target = buttons.find(b => b.dataset.value === String(value)) ?? buttons.find(b => b.getAttribute('aria-pressed') === 'true') ?? buttons[0];
            buttons.forEach(b => b.setAttribute('aria-pressed', b === target));
        }
        const onPick = (group, handler) => group.addEventListener('click', e => {
            const b = e.target.closest('.mode');
            if (!b || b.getAttribute('aria-pressed') === 'true') return;
            pick(group, b.dataset.value);
            handler();
        });

        const fillSelect = (select, values) => select.replaceChildren(...values.map(v => new Option(pretty(v), v)));

        // State lives in the URL hash (#type/category/days/view) so a view can be bookmarked.
        const [hashType, hashCategory, hashDays, hashView] = location.hash.slice(1).split('/');
        const saveHash = () => history.replaceState(null, '', `#${typeSelect.value}/${categorySelect.value}/${picked(rangePicker)}/${picked(viewPicker)}`);
        pick(rangePicker, hashDays || 3);
        pick(viewPicker, hashView || 'total');

        async function loadCategories(preferred) {
            const categories = await api(`/api/categories/${encodeURIComponent(typeSelect.value)}`);
            fillSelect(categorySelect, categories);
            categorySelect.value = [preferred, 'total_level'].find(c => categories.includes(c)) ?? categories[0];
            categorySelect.disabled = false;
        }

        async function init() {
            try {
                const types = await api('/api/types');
                if (!types.length) {
                    return showMessage('No data yet',
                        'The scraper has not saved a snapshot. Check the "Scrape leaderboards" workflow in GitHub Actions.');
                }
                fillSelect(typeSelect, types);
                typeSelect.value = [hashType, 'standard'].find(t => types.includes(t)) ?? types[0];
                typeSelect.disabled = false;
                await loadCategories(hashCategory);
                await load();
                setInterval(load, REFRESH_MS);
            } catch (e) {
                showMessage("Couldn't load leaderboards", e.message, init);
            }
        }

        async function load() {
            const key = `${typeSelect.value}/${categorySelect.value}`;
            try {
                data = await api(`/api/xp/${encodeURIComponent(typeSelect.value)}/${encodeURIComponent(categorySelect.value)}?days=${picked(rangePicker)}`);
            } catch (e) {
                return showMessage("Couldn't load this board", e.message, load);
            }
            saveHash();

            // New board: start from the top 10. Same board (auto-refresh, range change): keep the user's picks.
            if (key !== loadedKey || !selected.size) selected = new Set(data.players.slice(0, 10).map(p => p.name));
            loadedKey = key;

            renderStatus();
            renderPlayers();
            renderChart();
        }

        function renderStatus() {
            if (!data?.latest) { status.textContent = ''; return; }
            const minutes = Math.max(0, Math.round((Date.now() - Date.parse(data.latest)) / 60000));
            const ago = minutes < 1 ? 'just now' : minutes < 90 ? `${minutes} min ago` : `${Math.round(minutes / 60)} h ago`;
            const state = minutes > DOWN_MIN ? 'down' : minutes > LATE_MIN ? 'late' : 'fresh';
            status.dataset.state = state;
            status.textContent = state === 'down' ? `No new data, last update ${ago}` : `Updated ${ago}`;
            status.title = {
                fresh: 'The feed is up to date.',
                late: 'The last few scrapes are late or were skipped.',
                down: 'Nothing has arrived for over an hour. The scraper is probably failing: check the "Scrape leaderboards" workflow in GitHub Actions.',
            }[state] + ` Last data: ${fullTime.format(new Date(data.latest))}.`;
        }
        setInterval(renderStatus, 60000); // keep the age and colour current between data refreshes

        const palette = () => SERIES[getComputedStyle(document.documentElement).colorScheme === 'dark' ? 'dark' : 'light'];
        function colorOf(name) {
            const i = data.players.filter(p => selected.has(p.name)).findIndex(p => p.name === name);
            const colors = palette();
            return colors[i % colors.length];
        }

        function renderPlayers() {
            const query = search.value.trim().toLowerCase();
            $('playerCount').textContent = data.players.length ? `${selected.size} of ${data.players.length} shown` : '';
            const items = [];
            data.players.forEach((p, i) => {
                if (query && !p.name.toLowerCase().includes(query)) return;
                const on = selected.has(p.name);
                const btn = document.createElement('button');
                btn.setAttribute('aria-pressed', on);
                btn.title = `${p.name}: ${full.format(p.total)} XP`;
                const cell = (cls, text) => { const s = document.createElement('span'); s.className = cls; s.textContent = text; return s; };
                const swatch = cell('swatch', '');
                if (on) swatch.style.cssText = `background:${colorOf(p.name)};border-color:${colorOf(p.name)}`;
                btn.append(swatch, cell('rank', i + 1), cell('name', p.name), cell('total', compact.format(p.total)));
                btn.onclick = () => { on ? selected.delete(p.name) : selected.add(p.name); renderPlayers(); renderChart(); };
                btn.onmouseenter = btn.onfocus = () => emphasise(p.name);
                btn.onmouseleave = btn.onblur = () => emphasise(null);
                const li = document.createElement('li');
                li.append(btn);
                items.push(li);
            });
            if (!items.length && data.players.length) {
                const li = document.createElement('li');
                li.className = 'no-match';
                li.textContent = `No player matches "${search.value.trim()}".`;
                items.push(li);
            }
            playersEl.replaceChildren(...items);
        }

        // Thicken one line and fade the rest while its row is hovered or focused.
        function emphasise(name) {
            if (!chart) return;
            for (const ds of chart.data.datasets) {
                const base = colorOf(ds.label);
                ds.borderWidth = name && ds.label === name ? 3 : 1.75;
                ds.borderColor = !name || ds.label === name ? base : base + '2e';
            }
            chart.update('none');
        }

        // Running total of XP gained since the start of the range: lines only ever climb, steeper is faster.
        function cumulative(gains) {
            let sum = null;
            return gains.map(g => (g === null ? sum : (sum = (sum ?? 0) + g)));
        }

        // XP per hour, averaged over the last few points so one odd snapshot doesn't make a spike.
        function hourlyRate(gains) {
            const rates = gains.map((g, i) => (g === null ? null : g / data.hours[i]));
            return rates.map((r, i) => {
                if (r === null) return null;
                const window = rates.slice(Math.max(0, i - SMOOTH + 1), i + 1).filter(v => v !== null);
                return window.reduce((a, b) => a + b, 0) / window.length;
            });
        }

        // X axis ticks sit on round local times (midnight, 6 am, ...) instead of wherever a snapshot happened to land.
        let tickStepHours = 1;
        function timeTicks(min, max) {
            const HOUR = 3600000;
            tickStepHours = [1, 2, 3, 6, 12, 24, 48, 120].find(h => (max - min) / (h * HOUR) <= 9) ?? 168;
            const start = new Date(min);
            start.setHours(0, 0, 0, 0);
            const ticks = [];
            for (let t = start.getTime(); t <= max; t += tickStepHours * HOUR) if (t >= min) ticks.push({ value: t });
            return ticks;
        }
        const isMidnight = ms => { const d = new Date(ms); return d.getHours() === 0 && d.getMinutes() === 0; };
        const tickHour = new Intl.DateTimeFormat(undefined, { hour: 'numeric' });
        const weekday = new Intl.DateTimeFormat(undefined, { weekday: 'short' });
        const dayMonth = new Intl.DateTimeFormat(undefined, { day: 'numeric', month: 'short' });
        const dayLabel = ms => `${weekday.format(ms)} ${dayMonth.format(ms)}`;

        // Second row of the time axis: when the ticks are hours, each day is named once, under the point where it starts.
        const dayRow = {
            id: 'dayRow',
            afterDraw(c) {
                if (tickStepHours >= 24) return;
                const { ctx, chartArea: area, scales: { x } } = c;
                const y = c.height - 8;
                const first = new Date(x.min);
                first.setHours(0, 0, 0, 0);
                ctx.save();
                ctx.font = `600 12px ${Chart.defaults.font.family}`;
                ctx.fillStyle = css('--ink');
                ctx.textBaseline = 'alphabetic';
                for (let d = first; d.getTime() <= x.max; d.setDate(d.getDate() + 1)) {
                    const next = new Date(d); next.setDate(next.getDate() + 1);
                    const left = Math.max(x.getPixelForValue(d.getTime()), area.left);
                    const room = Math.min(x.getPixelForValue(next.getTime()), area.right) - left;
                    const text = dayLabel(d.getTime());
                    if (room >= ctx.measureText(text).width + 12) ctx.fillText(text, left, y);
                }
                ctx.restore();
            },
        };

        // Y axis ticks from zero in round steps (1, 2, 2.5 or 5 times a power of ten), about six of them.
        function yTicks(max) {
            const rough = max / 6, pow = 10 ** Math.floor(Math.log10(rough));
            const step = [1, 2, 2.5, 5, 10].find(m => m * pow >= rough) * pow;
            const ticks = [];
            for (let v = 0; v <= max * 1.03; v += step) ticks.push({ value: v });
            return ticks;
        }

        function renderChart() {
            chart?.destroy();
            chart = null;
            resetZoomBtn.hidden = true;
            if (!data.timestamps.length) {
                return showMessage('Not enough data in this range', 'XP gains appear once two snapshots have been saved.');
            }
            if (!selected.size) return showMessage('No players selected', 'Pick players from the list, or choose Top 10.');
            message.hidden = true;

            const view = picked(viewPicker);
            const series = view === 'rate' ? hourlyRate : cumulative;
            const times = data.timestamps.map(t => Date.parse(t));
            const datasets = data.players.filter(p => selected.has(p.name)).map(p => ({
                label: p.name,
                data: series(p.data).map((y, i) => ({ x: times[i], y })),
                borderColor: colorOf(p.name),
                backgroundColor: colorOf(p.name),
                borderWidth: 1.75,
                pointRadius: 0,
                pointHoverRadius: 4,
                cubicInterpolationMode: 'monotone',
                spanGaps: false,
            }));

            // Breathing room so lines never run along the axes: 2% of the time span each side, 4% under zero, 6% on top.
            const xPad = Math.max((times.at(-1) - times[0]) * 0.02, 60000);
            const yMax = Math.max(1, ...datasets.flatMap(ds => ds.data.map(d => d.y ?? 0)));

            // Chart chrome comes from the current look's tokens; the chart is rebuilt whenever the look changes.
            const ink = css('--ink'), soft = css('--ink-soft'), rule = css('--rule');
            Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
            Chart.defaults.font.size = 12;
            Chart.defaults.color = soft;
            chart = new Chart($('chart'), {
                type: 'line',
                plugins: [dayRow],
                data: { datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    layout: { padding: { top: 8, right: 12, bottom: 28, left: 6 } }, // bottom: room for the day row
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        x: {
                            type: 'linear',
                            min: times[0] - xPad, max: times.at(-1) + xPad,
                            afterBuildTicks: scale => { scale.ticks = timeTicks(scale.min, scale.max); },
                            ticks: {
                                padding: 14, maxRotation: 0, autoSkip: false,
                                callback: v => (tickStepHours >= 24 ? dayLabel(v) : tickHour.format(v)),
                            },
                            // a faint vertical rule where each day starts; no other vertical lines
                            grid: { drawTicks: false, color: c => (c.tick && tickStepHours < 24 && isMidnight(c.tick.value) ? rule : 'transparent') },
                            border: { color: rule },
                        },
                        y: {
                            min: -yMax * 0.04, max: yMax * 1.06,
                            afterBuildTicks: scale => { scale.ticks = yTicks(yMax); },
                            ticks: { padding: 18, autoSkip: false, callback: v => compact.format(v) },
                            grid: { color: rule, drawTicks: false },
                            border: { display: false },
                            title: { display: true, align: 'center', text: view === 'rate' ? 'XP per hour' : 'XP gained', color: soft, font: { size: 13, weight: 500 }, padding: { bottom: 14 } },
                        },
                    },
                    plugins: {
                        legend: { display: false }, // the player list is the legend
                        tooltip: {
                            backgroundColor: css('--raise'), titleColor: ink, bodyColor: soft,
                            borderColor: css('--rule-strong'), borderWidth: 1, padding: 10, boxPadding: 4, usePointStyle: true,
                            itemSort: (a, b) => b.parsed.y - a.parsed.y,
                            callbacks: {
                                title: items => fullTime.format(new Date(items[0].parsed.x)),
                                label: item => ` ${item.dataset.label}  ${full.format(item.parsed.y)}`,
                            },
                        },
                        zoom: {
                            limits: { x: { min: 'original', max: 'original' } },
                            zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'x', onZoomComplete: () => resetZoomBtn.hidden = false },
                            pan: { enabled: true, mode: 'x', onPanComplete: () => resetZoomBtn.hidden = false },
                        },
                    },
                },
            });
        }

        // A look or theme change restyles everything drawn on the canvas, so rebuild the chart from its tokens.
        window.addEventListener('mwi:look', () => {
            if (!data) return;
            renderPlayers();
            renderChart();
        });

        typeSelect.addEventListener('change', async () => {
            try { await loadCategories(categorySelect.value); await load(); }
            catch (e) { showMessage("Couldn't load this board", e.message, load); }
        });
        categorySelect.addEventListener('change', load);
        onPick(rangePicker, load);
        onPick(viewPicker, () => { saveHash(); renderChart(); });
        search.addEventListener('input', renderPlayers);
        $('top10Btn').addEventListener('click', () => { selected = new Set(data.players.slice(0, 10).map(p => p.name)); renderPlayers(); renderChart(); });
        $('clearBtn').addEventListener('click', () => { selected.clear(); renderPlayers(); renderChart(); });
        resetZoomBtn.addEventListener('click', () => { chart.resetZoom(); resetZoomBtn.hidden = true; });

        init();
    </script>
</body>
</html>
